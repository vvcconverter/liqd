<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIQD - Sports Betting Bookmaker</title>
<meta name="description" content="LIQD - a bookmaker for sports betting. Bet on your win.">
<meta property="og:description" content="LIQD - a bookmaker for sports betting. Bet on your win.">
<meta property="twitter:description" content="LIQD - a bookmaker for sports betting. Bet on your win.">
<style>
.sports-container {
  padding: 20px;
  color: #ffffff;
  font-family: 'Roboto', sans-serif;
}
.sports-container h2 {
  font-size: 32px;
  margin-bottom: 20px;
  text-transform: uppercase;
}
.sports-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}
.sport-item {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s;
}
.sport-item:hover {
  border-color: #2563eb;
}
.sport-item h3 {
  font-size: 16px;
  font-weight: 600;
}
</style>
</head>
<body>
<div class="sports-container">
  <h2>Sports Betting</h2>
  <div class="sports-list">
    <div class="sport-item"><h3>Football</h3></div>
    <div class="sport-item"><h3>Basketball</h3></div>
    <div class="sport-item"><h3>Tennis</h3></div>
    <div class="sport-item"><h3>Hockey</h3></div>
    <div class="sport-item"><h3>Baseball</h3></div>
    <div class="sport-item"><h3>MMA</h3></div>
  </div>
</div>
</body>
</html>
